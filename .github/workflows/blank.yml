# This is a basic workflow to help you get started with Actions

name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: cd OpenHome && gradle assembleDebug --no-daemon
      - run: |
          {
            echo '<pre>'
            find . -name "*.apk"
            ls -R OpenHome/app/build/outputs 2>&1 | head -40
            echo '</pre>'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHome-apk
          path: '**/*.apk'
